# AWS workload cluster for benchmarking (CAPA provider)
# 3 MachineDeployments matching different EC2 instance types, all starting at 0 replicas
# Apply with make: the Makefile fills in sshKeyName from AWS_SSH_KEY_NAME with envsubst
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: bench-cluster
  namespace: default
  labels:
    cluster-name: bench-cluster
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.128.0.0/12
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: bench-cluster-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: AWSCluster
    name: bench-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: bench-cluster
  namespace: default
spec:
  region: us-east-1
  sshKeyName: ${AWS_SSH_KEY_NAME}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: bench-cluster-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.35.7
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AWSMachineTemplate
        name: bench-cluster-control-plane
  kubeadmConfigSpec:
    files:
      # MostAllocated scoring: pack pods onto loaded nodes so empty large nodes
      # stay free for constrained pods, matching the solver's bin-packing plans.
      - path: /etc/kubernetes/scheduler-config.yaml
        owner: root:root
        permissions: "0644"
        content: |
          apiVersion: kubescheduler.config.k8s.io/v1
          kind: KubeSchedulerConfiguration
          clientConnection:
            kubeconfig: /etc/kubernetes/scheduler.conf
          profiles:
            - schedulerName: default-scheduler
              pluginConfig:
                - name: NodeResourcesFit
                  args:
                    scoringStrategy:
                      type: MostAllocated
                      resources:
                        - name: cpu
                          weight: 1
                        - name: memory
                          weight: 1
    clusterConfiguration:
      apiServer:
        extraArgs:
          # No cloud-provider flag: removed from the apiserver by 1.35,
          # external CCM is the only mode (controllerManager/kubelet keep theirs)
          # MutatingAdmissionPolicy is beta in 1.35, off by default
          - name: feature-gates
            value: MutatingAdmissionPolicy=true
          - name: runtime-config
            value: admissionregistration.k8s.io/v1beta1=true
      controllerManager:
        extraArgs:
          - name: cloud-provider
            value: external
      scheduler:
        extraArgs:
          - name: config
            value: /etc/kubernetes/scheduler-config.yaml
        extraVolumes:
          - name: scheduler-config
            hostPath: /etc/kubernetes/scheduler-config.yaml
            mountPath: /etc/kubernetes/scheduler-config.yaml
            readOnly: true
            pathType: File
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ ds.meta_data.local_hostname }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ ds.meta_data.local_hostname }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: bench-cluster-control-plane
  namespace: default
spec:
  template:
    spec:
      instanceType: t3.medium
      iamInstanceProfile: control-plane.cluster-api-provider-aws.sigs.k8s.io
      sshKeyName: ${AWS_SSH_KEY_NAME}
      # 8GiB default filled after ~9 weeks and DiskPressure evicted the CCM
      rootVolume:
        size: 40
---
# Worker pool "small" - t3.medium (2 vCPU / 4 GiB)
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: bench-cluster-workers-small
  namespace: default
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "10"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "2"
    capacity.cluster-autoscaler.kubernetes.io/memory: "4Gi"
    wikoion.dev/cost-per-hour: "0.0416"
    capacity.cluster-autoscaler.kubernetes.io/labels: "kubernetes.io/os=linux,node.kubernetes.io/instance-type=t3.medium"
  labels:
    cluster.x-k8s.io/cluster-name: bench-cluster
    wikoion.dev/cluster-id: bench-cluster
    node-pool: small
spec:
  clusterName: bench-cluster
  replicas: 0
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: bench-cluster
      version: v1.35.7
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: bench-cluster-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AWSMachineTemplate
        name: bench-cluster-workers-small
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
