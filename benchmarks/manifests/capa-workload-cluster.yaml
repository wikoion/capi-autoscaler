# Remediate machines that never become nodes (e.g. AWS capacity shortfalls):
# without this, stuck machines hold MachineDeployment spec above actual node
# count indefinitely and stall the autoscaler's provisioning accounting.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: bench-cluster-workers-mhc
  namespace: default
spec:
  clusterName: bench-cluster
  selector:
    matchExpressions:
      - key: cluster.x-k8s.io/control-plane
        operator: DoesNotExist
  checks:
    # Generous timeouts: calico's BGP mesh can take several minutes to
    # converge when many nodes join at once; remediating at 300s deletes
    # healthy-but-slow nodes en masse and restarts the join storm.
    nodeStartupTimeoutSeconds: 900
    unhealthyNodeConditions:
      - type: Ready
        status: "False"
        timeoutSeconds: 900
      - type: Ready
        status: Unknown
        timeoutSeconds: 900
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
