[package]
name = "capi-autoscaler"
version = "0.1.0"
edition = "2024"

[dependencies]
optimiser = { path = "../optimiser" }
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
kube = { version = "3.0.0", features = ["client", "runtime", "derive", "unstable-runtime"] }
kube-core = "3.0.0"
schemars = { version = "1.2.0", features = ["chrono04", "preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
kopium = "0.22.5"
kube_quantity = "0.9.0"
http = "1.4.0"
http-body-util = "0.1.3"
bytes = "1.11.1"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
